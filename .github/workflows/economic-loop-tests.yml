name: Economic survival loop tests

on:
  pull_request:
    paths:
      - "loop/economics.py"
      - "loop/economic_loop.py"
      - "loop/economic_watcher.md"
      - "tests/test_economic_governor.py"
      - "demo/test_economics.py"
      - ".github/workflows/economic-loop-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest demo/test_economics.py tests/test_economic_governor.py
      - name: Syntax compile
        run: python -m py_compile loop/economics.py loop/economic_loop.py tests/test_economic_governor.py
