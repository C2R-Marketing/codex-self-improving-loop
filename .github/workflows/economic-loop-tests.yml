name: economic-loop-tests

on:
  pull_request:
  push:
    branches:
      - master
      - feat/economic-survival-loop-v1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile loop/economic_loop.py tests/test_economic_loop.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
